version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pixeles-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: pixeles
      POSTGRES_USER: pixeles
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pixeles_secret_2024}
    networks:
      - pixeles_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixeles -d pixeles"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pixeles-redis
    volumes:
      - redis_data:/data
    networks:
      - pixeles_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixeles-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pixeles
      DB_USER: pixeles
      DB_PASSWORD: ${DB_PASSWORD:-pixeles_secret_2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: "*"
      TZ: America/Guatemala
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pixeles_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pixeles-web
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pixeles_net
    restart: unless-stopped

networks:
  pixeles_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
